[package]
name = "cctk"
version.workspace = true
description = "Shared core for the claude-toolkit tools (JSONL schema, pricing, path/tail helpers)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# `tail` enables the tokio poll-tail and the async `claude agents --json`
# call (`cctk::agents`). Pure consumers (ccstat, ccmap, ccfocus)
# depend on cctk with default features and never pull in tokio.
default = []
tail = ["dep:tokio", "dep:futures"]
# `cli` adds the clap flag structs the binaries share (`cctk::cli`). ccfocus
# does not need it, and its hook stays free of the shared flags.
cli = ["dep:clap"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
